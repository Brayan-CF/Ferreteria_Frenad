version: '3.8'

# ============================================================================
# REDES
# ============================================================================
networks:
  ferreteria_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLÚMENES PERSISTENTES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  backend_vendor:
    driver: local
  frontend_node_modules:
    driver: local

# ============================================================================
# SERVICIOS
# ============================================================================
services:

  # ==========================================================================
  # SERVICIO 1: PostgreSQL Database
  # ==========================================================================
  postgres_ferreteria:
    image: postgres:15-alpine
    container_name: ferreteria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ferreteria_frenad}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frenad_postgres_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_ES.UTF-8"
      TZ: America/La_Paz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # Comentado: usar migrate.sh después de iniciar
      - ./database:/database:ro  # Scripts SQL disponibles dentro del contenedor
    networks:
      ferreteria_network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-ferreteria_frenad}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # SERVICIO 2: Backend Laravel (API REST)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: ferreteria_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-FerreriaFrenad}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres_ferreteria
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ferreteria_frenad}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-frenad_postgres_2024}
      TZ: America/La_Paz
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres_ferreteria:
        condition: service_healthy
    networks:
      ferreteria_network:
        ipv4_address: 172.20.0.20
    command: php artisan serve --host=0.0.0.0 --port=8000

  # ==========================================================================
  # SERVICIO 3: Frontend (Nginx + PHP + JS)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ferreteria_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      ferreteria_network:
        ipv4_address: 172.20.0.30
    environment:
      BACKEND_API_URL: http://backend:8000/api
      TZ: America/La_Paz

  # ==========================================================================
  # SERVICIO 4: pgAdmin (Opcional - Solo para desarrollo)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ferreteria_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@frenad.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./database/pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_ferreteria
    networks:
      ferreteria_network:
        ipv4_address: 172.20.0.40
    profiles:
      - dev  # Solo se levanta si usas: docker-compose --profile dev up