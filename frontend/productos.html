<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Ferreteria Frenad</title>
  <link rel="stylesheet" href="css/variables.css?v=2.0.0">
  <link rel="stylesheet" href="css/reset.css?v=2.0.0">
  <link rel="stylesheet" href="css/components.css?v=2.0.0">
  <link rel="stylesheet" href="css/layout.css?v=2.0.0">
</head>
<body>
  <div class="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">F</div>
        <div class="sidebar-brand">
          <div class="sidebar-title">Ferreteria Frenad</div>
          <div class="sidebar-subtitle">Sistema POS</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Usuario</div>
            <div class="sidebar-user-role" id="user-role">Rol</div>
          </div>
          <button type="button" class="btn btn-icon" id="logout-btn" title="Cerrar sesion">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="main-content">
      <header class="app-header">
        <div class="header-left">
          <button type="button" class="header-toggle" id="sidebar-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="header-title">Productos</h1>
        </div>
        <div class="header-right">
          <div class="theme-toggle"></div>
        </div>
      </header>
      <div class="content-area">
        <div class="content-header">
          <div class="content-header-left">
            <input type="text" id="search-input" class="form-control" placeholder="Buscar producto..." style="width: 300px;">
          </div>
          <div class="content-header-right">
            <button type="button" class="btn btn-primary" id="btn-nuevo">+ Nuevo Producto</button>
          </div>
        </div>
        <div class="card">
          <div class="table-container">
            <table class="table" id="productos-table">
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>Nombre</th>
                  <th>Categoria</th>
                  <th>Precio Compra</th>
                  <th>Precio Venta</th>
                  <th>Stock Total</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="productos-body">
                <tr><td colspan="8" class="text-center">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Producto -->
  <div class="modal-overlay" id="modal-producto">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Nuevo Producto</h3>
        <button type="button" class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-producto">
          <input type="hidden" id="producto-id">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">SKU *</label>
              <input type="text" id="producto-sku" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Codigo de Barras</label>
              <input type="text" id="producto-barras" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Nombre *</label>
            <input type="text" id="producto-nombre" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Descripcion</label>
            <textarea id="producto-descripcion" class="form-control" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Categoria *</label>
              <select id="producto-categoria" class="form-control" required>
                <option value="">Seleccionar...</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Unidad Base *</label>
              <select id="producto-unidad" class="form-control" required>
                <option value="">Seleccionar...</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Precio Compra *</label>
              <input type="number" id="producto-precio-compra" class="form-control" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label class="form-label">Precio Venta *</label>
              <input type="number" id="producto-precio-venta" class="form-control" step="0.01" min="0" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" id="producto-activo" checked>
              <span>Producto activo</span>
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancelar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1.0.5"></script>
  <script src="js/api.js?v=1.0.5"></script>
  <script src="js/auth.js?v=1.0.5"></script>
  <script src="js/utils.js?v=1.0.5"></script>
  <script src="js/theme.js?v=1.0.5"></script>
  <script>
    var paginaActual = 1;
    var categorias = [];
    var unidades = [];

    document.addEventListener('DOMContentLoaded', function() {
      if (!auth.requireAuth()) return;
      initUI();
      cargarCategorias();
      cargarUnidades();
      cargarProductos();
    });

    function initUI() {
      var userName = auth.getUserName();
      var userRole = auth.getUserRole();
      document.getElementById('user-name').textContent = userName;
      document.getElementById('user-role').textContent = userRole;
      document.getElementById('user-avatar').textContent = auth.getUserInitials();

      var navItems = {
        dashboard: { icon: 'D', text: 'Dashboard', href: 'dashboard.html' },
        pos: { icon: 'P', text: 'Punto de Venta', href: 'pos.html' },
        productos: { icon: 'Pr', text: 'Productos', href: 'productos.html' },
        inventario: { icon: 'I', text: 'Inventario', href: 'inventario.html' },
        clientes: { icon: 'C', text: 'Clientes', href: 'clientes.html' },
        compras: { icon: 'Co', text: 'Compras', href: 'compras.html' },
        reportes: { icon: 'R', text: 'Reportes', href: 'reportes.html' }
      };
      var permissions = CONFIG.PERMISSIONS[userRole] || [];
      var navHTML = '<div class="nav-section"><div class="nav-section-title">Menu</div>';
      for (var i = 0; i < permissions.length; i++) {
        var page = permissions[i];
        if (navItems[page]) {
          var item = navItems[page];
          var isActive = page === 'productos' ? 'active' : '';
          navHTML += '<a href="' + item.href + '" class="nav-item ' + isActive + '">';
          navHTML += '<span class="nav-item-icon">' + item.icon + '</span>';
          navHTML += '<span>' + item.text + '</span></a>';
        }
      }
      navHTML += '</div>';
      document.getElementById('sidebar-nav').innerHTML = navHTML;

      document.getElementById('search-input').onkeypress = function(e) {
        if (e.key === 'Enter') cargarProductos();
      };
      document.getElementById('btn-nuevo').onclick = abrirModalNuevo;
      document.getElementById('modal-close').onclick = cerrarModal;
      document.getElementById('btn-cancelar').onclick = cerrarModal;
      document.getElementById('btn-guardar').onclick = guardarProducto;
      document.getElementById('logout-btn').onclick = function() {
        if (confirm('Cerrar sesion?')) auth.logout();
      };
      document.getElementById('sidebar-toggle').onclick = function() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('active');
      };
      document.getElementById('sidebar-overlay').onclick = function() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('active');
      };
    }

    function cargarCategorias() {
      api.get('/product/categorias', { per_page: 100 }).then(function(res) {
        if (res.success && res.data) {
          categorias = res.data.data || res.data;
          var select = document.getElementById('producto-categoria');
          select.innerHTML = '<option value="">Seleccionar...</option>';
          for (var i = 0; i < categorias.length; i++) {
            select.innerHTML += '<option value="' + categorias[i].id + '">' + escapeHtml(categorias[i].nombre) + '</option>';
          }
        }
      });
    }

    function cargarUnidades() {
      api.get('/product/unidades', { per_page: 100 }).then(function(res) {
        if (res.success && res.data) {
          unidades = res.data.data || res.data;
          var select = document.getElementById('producto-unidad');
          select.innerHTML = '<option value="">Seleccionar...</option>';
          for (var i = 0; i < unidades.length; i++) {
            select.innerHTML += '<option value="' + unidades[i].id + '">' + escapeHtml(unidades[i].nombre) + ' (' + unidades[i].abreviatura + ')</option>';
          }
        }
      });
    }

    function cargarProductos() {
      var tbody = document.getElementById('productos-body');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center">Cargando...</td></tr>';
      var search = document.getElementById('search-input').value;
      api.get('/product/productos', { search: search, page: paginaActual, per_page: 15 }).then(function(res) {
        if (res.success && res.data) {
          var productos = res.data.data || res.data;
          if (!productos || productos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay productos</td></tr>';
            return;
          }
          var html = '';
          for (var i = 0; i < productos.length; i++) {
            var p = productos[i];
            var stockTotal = 0;
            if (p.inventarios) {
              for (var j = 0; j < p.inventarios.length; j++) {
                stockTotal += parseFloat(p.inventarios[j].cantidad_actual || 0);
              }
            }
            var catNombre = p.categoria ? p.categoria.nombre : '-';
            var estado = p.activo ? '<span class="badge badge-success">Activo</span>' : '<span class="badge badge-danger">Inactivo</span>';
            html += '<tr>';
            html += '<td>' + escapeHtml(p.sku) + '</td>';
            html += '<td>' + escapeHtml(p.nombre) + '</td>';
            html += '<td>' + escapeHtml(catNombre) + '</td>';
            html += '<td>Bs. ' + parseFloat(p.precio_compra).toFixed(2) + '</td>';
            html += '<td>Bs. ' + parseFloat(p.precio_venta).toFixed(2) + '</td>';
            html += '<td>' + stockTotal + '</td>';
            html += '<td>' + estado + '</td>';
            html += '<td>';
            html += '<button class="btn btn-sm btn-outline" onclick="editarProducto(' + p.id + ')">Editar</button> ';
            html += '<button class="btn btn-sm btn-danger" onclick="eliminarProducto(' + p.id + ')">Eliminar</button>';
            html += '</td>';
            html += '</tr>';
          }
          tbody.innerHTML = html;
          renderPaginacion(res.data);
        } else {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center">Error al cargar</td></tr>';
        }
      }).catch(function() {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">Error de conexion</td></tr>';
      });
    }

    function renderPaginacion(data) {
      var pagination = document.getElementById('pagination');
      if (!data.last_page || data.last_page <= 1) {
        pagination.innerHTML = '';
        return;
      }
      var html = '';
      for (var i = 1; i <= data.last_page; i++) {
        var active = i === data.current_page ? 'active' : '';
        html += '<button class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-outline') + '" onclick="irPagina(' + i + ')">' + i + '</button> ';
      }
      pagination.innerHTML = html;
    }

    function irPagina(num) {
      paginaActual = num;
      cargarProductos();
    }

    function abrirModalNuevo() {
      document.getElementById('modal-title').textContent = 'Nuevo Producto';
      document.getElementById('producto-id').value = '';
      document.getElementById('form-producto').reset();
      document.getElementById('producto-activo').checked = true;
      document.getElementById('modal-producto').classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('modal-producto').classList.remove('active');
    }

    function editarProducto(id) {
      api.get('/product/productos/' + id).then(function(res) {
        if (res.success && res.data) {
          var p = res.data;
          document.getElementById('modal-title').textContent = 'Editar Producto';
          document.getElementById('producto-id').value = p.id;
          document.getElementById('producto-sku').value = p.sku || '';
          document.getElementById('producto-barras').value = p.codigo_barras || '';
          document.getElementById('producto-nombre').value = p.nombre || '';
          document.getElementById('producto-descripcion').value = p.descripcion || '';
          document.getElementById('producto-categoria').value = p.categoria_id || '';
          document.getElementById('producto-unidad').value = p.unidad_base_id || '';
          document.getElementById('producto-precio-compra').value = p.precio_compra || '';
          document.getElementById('producto-precio-venta').value = p.precio_venta || '';
          document.getElementById('producto-activo').checked = p.activo;
          document.getElementById('modal-producto').classList.add('active');
        }
      });
    }

    function guardarProducto() {
      var id = document.getElementById('producto-id').value;
      var data = {
        sku: document.getElementById('producto-sku').value,
        codigo_barras: document.getElementById('producto-barras').value || null,
        nombre: document.getElementById('producto-nombre').value,
        descripcion: document.getElementById('producto-descripcion').value || null,
        categoria_id: parseInt(document.getElementById('producto-categoria').value),
        unidad_base_id: parseInt(document.getElementById('producto-unidad').value),
        precio_compra: parseFloat(document.getElementById('producto-precio-compra').value),
        precio_venta: parseFloat(document.getElementById('producto-precio-venta').value),
        activo: document.getElementById('producto-activo').checked
      };
      var btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      var promise = id ? api.put('/product/productos/' + id, data) : api.post('/product/productos', data);
      promise.then(function(res) {
        if (res.success) {
          Utils.showSuccess(id ? 'Producto actualizado' : 'Producto creado');
          cerrarModal();
          cargarProductos();
        } else {
          Utils.showError(res.message || 'Error al guardar');
        }
      }).catch(function() {
        Utils.showError('Error de conexion');
      }).finally(function() {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      });
    }

    function eliminarProducto(id) {
      if (!confirm('Eliminar este producto?')) return;
      api.delete('/product/productos/' + id).then(function(res) {
        if (res.success) {
          Utils.showSuccess('Producto eliminado');
          cargarProductos();
        } else {
          Utils.showError(res.message || 'Error al eliminar');
        }
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
